<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Layout 1 Grid</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: #eaeaea;
      font-family: Arial, Helvetica, sans-serif;
    }

    .page {
      width: 100vw;
      height: 100vh;
      display: grid;
      grid-template-columns: 1fr 2.6fr;
      grid-template-rows: 90px 1fr 90px;
      grid-template-areas:
        "header header"
        "nav main"
        "nav footer";
      border: 3px solid #2a2a2a;
      background: #dfdfdf;
    }

    .header,
    .nav,
    .main,
    .footer {
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(1.5rem, 2vw, 2rem);
      font-weight: 500;
      color: #2a2a2a;
      border: 2px solid #2a2a2a;
    }

    .header {
      grid-area: header;
      background: #f1a0c2;
    }

    .nav {
      grid-area: nav;
      background: #d7d49a;
      font-size: 1.8rem;
      align-self: stretch;
      justify-self: stretch;
    }

    .main {
      grid-area: main;
      background: #d5b180;
      padding: 16px;
      align-self: stretch;
      justify-self: stretch;
    }

    .content {
      width: 100%;
      height: 100%;
      display: grid;
      grid-template-columns: 1fr 1.2fr;
      gap: 12px;
      align-items: center;
      padding: 8px 10px;
      border: 2px solid #2a2a2a;
      background: rgba(255,255,255,0.06);
    }

    .text {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 10px;
      height: 100%;
      padding: 6px 4px 6px 0;
    }

    .text p {
      margin: 0;
      font-size: 1.8rem;
      line-height: 1.2;
      color: #2a2a2a;
      font-weight: 500;
    }

    .photo {
      width: 100%;
      max-width: 220px;
      height: 160px;
      justify-self: center;
      border: 3px solid #2a2a2a;
      background: linear-gradient(135deg, #f7efe2 0%, #d6b98f 100%);
      position: relative;
      overflow: hidden;
    }

    .photo::before {
      content: "";
      position: absolute;
      inset: 16px;
      border: 2px solid #2a2a2a;
      background: rgba(255,255,255,0.08);
    }

    .footer {
      grid-area: footer;
      background: #b5d39b;
      font-size: 1.8rem;
    }

    @media (max-width: 700px) {
      .page {
        grid-template-columns: 1fr;
        grid-template-rows: 80px 90px 1fr 80px;
        grid-template-areas:
          "header"
          "nav"
          "main"
          "footer";
      }

      .content {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="header">Header</header>
    <nav class="nav">Nav</nav>
    <main class="main">
      <div class="content">
        <img src="imgs5/pessoa-estudando.jpg" alt="Pessoa estudando" class="photo">
        <div class="text">
          <p>Eu amo estudar tipo muito mesmo paixão de vida assim</p>
          <p>nunca trocaria por nada nem por uma comida bem gostosa</p>
          <p>me sinto super satisfeita quando estudo sem parar e sem dormir</p>
        </div>
      </div>
    </main>
    <footer class="footer">Footer</footer>
  </div>
</body>
</html>
