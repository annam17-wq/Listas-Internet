<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #ffffff;
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .page {
            width: 760px;
        }

        .canvas {
            width: 100%;
            min-height: 340px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .user-list {
            width: 380px;
            background: #f6f6f6;
            border: 1px solid #c9c9c9;
        }

        .user-item {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            min-height: 72px;
            border-bottom: 1px solid #dddddd;
        }

        .user-item:last-child {
            border-bottom: none;
        }

        .avatar-container {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            overflow: hidden;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #d8d8d8;
        }

        .avatar {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .user-info {
            margin-left: 14px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 2px;
        }

        .user-name {
            font-size: 18px;
            color: #2d2d2d;
            font-weight: 500;
            line-height: 1.1;
        }

        .user-address {
            font-size: 13px;
            color: #808080;
            line-height: 1.2;
        }
    </style>
</head>
<body>
    <div class="page">
        <div class="canvas">
            <div class="user-list" id="user-list-container"></div>
        </div>
    </div>

    <script>
        const container = document.getElementById('user-list-container');

        async function carregarUsuarios() {
            try {
                const resposta = await fetch('https://randomuser.me/api/?results=4');
                const dados = await resposta.json();

                container.innerHTML = dados.results.map((usuario) => {
                    const nomeCompleto = `${usuario.name.first} ${usuario.name.last}`;
                    const endereco = `${usuario.location.street.number} ${usuario.location.street.name}`;

                    return `
                        <div class="user-item">
                            <div class="avatar-container">
                                <img class="avatar" src="${usuario.picture.medium}" alt="${nomeCompleto}">
                            </div>
                            <div class="user-info">
                                <span class="user-name">${nomeCompleto}</span>
                                <span class="user-address">${endereco}</span>
                            </div>
                        </div>
                    `;
                }).join('');
            } catch (erro) {
                container.innerHTML = `
                    <div class="user-item">
                        <div class="user-info">
                            <span class="user-name">Erro ao carregar usuários</span>
                        </div>
                    </div>
                `;
                console.error('Erro ao buscar usuários:', erro);
            }
        }

        carregarUsuarios();
    </script>
</body>
</html>
