<!DOCTYPE html>
<html lang="pt-BR">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Display Horizontal</title>
	<style>
		* {
			box-sizing: border-box;
			margin: 0;
			padding: 0;
		}

		body {
			min-height: 100vh;
			font-family: Arial, sans-serif;
		}

		.container {
			min-height: 100vh;
			display: flex;
		}

		.faixa {
			width: 25%;
			min-height: 100vh;
			display: flex;
			align-items: center;
			justify-content: center;
			font-size: 18px;
		}

		.faixa-1 { background: #6500ff; }
		.faixa-2 { background: #009b12; }
		.faixa-3 { background: #ff0808; }
		.faixa-4 { background: #f1ff00; }
	</style>
</head>
<body>
	<main class="container">
		<div class="faixa faixa-1">1</div>
		<div class="faixa faixa-2">2</div>
		<div class="faixa faixa-3">3</div>
		<div class="faixa faixa-4">4</div>
	</main>
</body>
</html>
